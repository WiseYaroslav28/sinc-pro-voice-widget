<!doctype html>
<html class="dark" lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SINC Anchor</title>
    <link rel="stylesheet" href="styles.css" />
    <style>
      * {
        box-sizing: border-box;
        user-select: none;
        -webkit-user-select: none;
        outline: none !important;
      }

      html, body {
        margin: 0;
        padding: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent !important;
        background-color: transparent !important;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      #anchor-badge {
        position: relative;
        width: 30px;
        height: 30px;
        border-radius: 9999px;
        background: rgba(24, 23, 34, 0.92);
        border: 1.5px solid rgba(245, 158, 11, 0.9);
        box-shadow: 0 0 12px rgba(245, 158, 11, 0.45), 0 3px 8px rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: grab;
        transition: opacity 0.2s ease, transform 0.16s ease, border-color 0.2s ease, box-shadow 0.2s ease;
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
      }

      #anchor-badge:hover {
        opacity: 1 !important;
        transform: scale(1.1);
        border-color: #fbbf24;
        box-shadow: 0 0 16px rgba(251, 191, 36, 0.72), 0 4px 10px rgba(0, 0, 0, 0.65);
      }

      #anchor-badge.occluded {
        opacity: 0.35;
      }

      #anchor-badge.dragging {
        opacity: 1 !important;
        cursor: grabbing;
        transform: scale(1.14);
        border-color: #8e52ff;
        box-shadow: 0 0 0 4px rgba(142, 82, 255, 0.28), 0 0 18px rgba(251, 191, 36, 0.75);
      }

      #anchor-pin-icon {
        font-size: 16px;
        color: #fbbf24;
        font-variation-settings: 'FILL' 1, 'wght' 500, 'GRAD' 0, 'opsz' 20;
        transform: rotate(35deg);
        transition: transform 0.16s ease, color 0.2s ease;
        pointer-events: none;
      }

      #anchor-badge.dragging #anchor-pin-icon {
        transform: rotate(0deg);
        color: #eaddff;
      }

      #anchor-ring {
        position: absolute;
        inset: -3px;
        border-radius: 9999px;
        border: 2px solid #45a29e;
        opacity: 0;
        pointer-events: none;
      }

      #anchor-badge.pulse-paste {
        border-color: #45a29e;
        box-shadow: 0 0 18px rgba(69, 162, 158, 0.85), 0 3px 8px rgba(0, 0, 0, 0.6);
      }

      #anchor-badge.pulse-paste #anchor-pin-icon {
        color: #7bd6d1;
      }

      #anchor-badge.pulse-paste #anchor-ring {
        animation: anchor-ring-pulse 0.6s ease-out forwards;
      }

      @keyframes anchor-ring-pulse {
        0% {
          transform: scale(0.92);
          opacity: 0.9;
        }
        100% {
          transform: scale(1.55);
          opacity: 0;
        }
      }
    </style>
  </head>
  <body>
    <div id="anchor-badge" title="📌 Якорь вставки текста&#10;Клик — снять якорь&#10;Перетащите — перенести в другое окно">
      <div id="anchor-ring"></div>
      <span class="material-symbols-outlined" id="anchor-pin-icon">push_pin</span>
    </div>

    <script>
      const badge = document.getElementById('anchor-badge');

      function registerAnchorHitRegion() {
        if (!window.__TAURI__ || !window.__TAURI__.core) return;
        const sf = window.devicePixelRatio || 1;
        window.__TAURI__.core.invoke('set_click_region', {
          rects: [{ x: 13, y: 13, width: 30, height: 30, radius: 15 }],
          scaleFactor: sf
        }).catch(() => {});
      }

      function updateBadgeTooltip(info) {
        if (!badge) return;
        const label = (info && (info.window_title || info.app_name))
          ? `${info.window_title || info.app_name}`
          : 'выбранное окно';
        badge.title = `📌 Якорь ввода: ${label}\nКлик — снять якорь\nПеретащите — перенести в другое место`;
      }

      if (badge) {
        badge.addEventListener('mousedown', (e) => {
          if (e.button !== 0) return;
          e.preventDefault();
          e.stopPropagation();
          if (window.__TAURI__ && window.__TAURI__.core) {
            window.__TAURI__.core.invoke('start_anchor_pin_drag', { fromBeacon: true }).catch(() => {});
          }
        });
      }

      if (window.__TAURI__) {
        const { invoke } = window.__TAURI__.core;
        const { listen } = window.__TAURI__.event;

        registerAnchorHitRegion();
        window.addEventListener('resize', registerAnchorHitRegion);

        invoke('get_anchor_state').then(updateBadgeTooltip).catch(() => {});

        listen('anchor-state-changed', (event) => {
          updateBadgeTooltip(event.payload || {});
          registerAnchorHitRegion();
        });

        listen('anchor-drag-state', (event) => {
          const dragging = !!(event.payload && event.payload.dragging);
          if (badge) {
            badge.classList.toggle('dragging', dragging);
          }
        });

        listen('anchor-occluded', (event) => {
          const occluded = !!(event.payload && event.payload.occluded);
          if (badge) {
            badge.classList.toggle('occluded', occluded);
          }
        });

        let pulseTimer = null;
        listen('anchor-paste-pulse', () => {
          if (!badge) return;
          badge.classList.remove('pulse-paste');
          void badge.offsetWidth;
          badge.classList.add('pulse-paste');
          if (pulseTimer) clearTimeout(pulseTimer);
          pulseTimer = setTimeout(() => {
            badge.classList.remove('pulse-paste');
          }, 620);
        });
      }
    </script>
  </body>
</html>
